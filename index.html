/* Layout: guidebook spread. Map on the left, the itinerary on the right as a list that opens into a stop card.
   Day 1 is tram-orange (Milan's old trams), Day 2 canal-teal (the Navigli). */
:root{
  --bg:#f3eff0; --paper:#fdfbfb; --ink:#1e1a20; --muted:#6b6470; --rule:#e2dadd; --soft:#ece5e8;
  --d1:#d97e00; --d2:#16808a; --red:#b3203a; --free:#2f7d4f;
  --f-disp:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --f-ui:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141215; --paper:#1c191d; --ink:#efe9ec; --muted:#a69ca8; --rule:#322c33; --soft:#262126;
  --d1:#f0a23a; --d2:#4cc0c8; --red:#ff6b81; --free:#6fd39a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141215; --paper:#1c191d; --ink:#efe9ec; --muted:#a69ca8; --rule:#322c33; --soft:#262126;
  --d1:#f0a23a; --d2:#4cc0c8; --red:#ff6b81; --free:#6fd39a; color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);overflow:hidden}
.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 430px}
#map{min-height:0;background:#e9e4dc}
.panel{background:var(--paper);border-left:1px solid var(--rule);display:flex;flex-direction:column;min-height:0}
.head{padding:18px 20px 12px;border-bottom:1px solid var(--rule)}
.head .kick{font:600 11px var(--f-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--red)}
.head h1{margin:4px 0 6px;font:700 34px/1.02 var(--f-disp);letter-spacing:-.01em}
.head h1 em{font-style:italic;font-weight:500}
.facts{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.facts b{color:var(--ink);font-weight:600}
.days{display:flex;gap:6px;padding:10px 20px;border-bottom:1px solid var(--rule)}
.days button{font:600 13px var(--f-ui);padding:6px 12px;border-radius:999px;border:1px solid var(--rule);background:transparent;color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.days button i{width:10px;height:10px;border-radius:50%}
.days button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.scroll{flex:1;min-height:0;overflow:auto}
.dayh{display:flex;align-items:baseline;gap:10px;padding:16px 20px 6px}
.dayh h2{margin:0;font:700 20px var(--f-disp)}
.dayh span{font-size:12.5px;color:var(--muted)}
ol.stops{list-style:none;margin:0;padding:0 10px 8px}
.stops button{width:100%;display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;background:none;border:0;border-radius:10px;padding:8px 10px;cursor:pointer;color:var(--ink);font:inherit}
.stops button:hover{background:var(--soft)}
.stops button[aria-current="true"]{background:var(--soft)}
.num{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:700 13px var(--f-ui);color:#fff;font-variant-numeric:tabular-nums}
.nm{min-width:0}
.nm b{display:block;font-weight:600;font-size:14.5px;line-height:1.25}
.nm small{display:block;color:var(--muted);font-size:12px;font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font:600 11.5px var(--f-ui);padding:3px 8px;border-radius:999px;white-space:nowrap;font-variant-numeric:tabular-nums}
.tag.free{color:var(--free);background:color-mix(in srgb,var(--free) 12%,transparent)}
.tag.paid{color:var(--red);background:color-mix(in srgb,var(--red) 10%,transparent)}
.note{margin:6px 20px 20px;font-size:12px;color:var(--muted);line-height:1.5}

/* stop card */
.card{padding:16px 20px 24px;display:flex;flex-direction:column;gap:14px}
.nav{display:flex;gap:8px;align-items:center}
.nav button{font:600 13px var(--f-ui);padding:6px 11px;border-radius:8px;border:1px solid var(--rule);background:transparent;color:var(--ink);cursor:pointer}
.nav button:disabled{opacity:.35;cursor:default}
.nav .sp{flex:1}
.card .top{display:flex;gap:12px;align-items:flex-start}
.card .top .num{width:40px;height:40px;font-size:16px;flex:0 0 auto}
.card h2{margin:0;font:700 25px/1.12 var(--f-disp);text-wrap:balance}
.card .it{margin:3px 0 0;font:italic 500 15px var(--f-disp);color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.meta span{font-size:12.5px;padding:4px 9px;border-radius:7px;background:var(--soft);color:var(--ink)}
.sec h3{margin:0 0 5px;font:600 11px var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.sec p{margin:0;font-size:15px;line-height:1.6;max-width:62ch}
.price{border:1px solid var(--rule);border-radius:10px;padding:10px 12px}
.price p{font-size:14px}
.tip{border-radius:10px;padding:12px 14px;background:color-mix(in srgb,var(--dc) 11%,transparent);border-left:3px solid var(--dc)}
.tip p{font-size:14.5px}
.card a{color:var(--red);font-weight:600;font-size:13.5px}
button:focus-visible,a:focus-visible{outline:2px solid var(--red);outline-offset:2px}

/* map */
.pin{width:28px;height:28px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.35);border:2px solid #fff}
.pin span{transform:rotate(45deg);color:#fff;font:700 12px "Instrument Sans",system-ui,sans-serif}
.pin.on{width:36px;height:36px;box-shadow:0 0 0 4px rgba(179,32,58,.35),0 2px 6px rgba(0,0,0,.4)}
.pin.on span{font-size:14px}
.pin.dim{opacity:.35}
.mapnote{cursor:pointer;position:absolute;left:12px;bottom:24px;z-index:500;background:var(--paper);color:var(--muted);font-size:12px;padding:6px 10px;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.2);max-width:300px;line-height:1.4}
.slbl{background:none;border:0;box-shadow:none;font:italic 600 12px "Bodoni Moda",Georgia,serif;color:#5d5560;padding:0}
.slbl::before{display:none}
.leaflet-container{font-family:var(--f-ui)}
.leaflet-tooltip.tt{font:600 12.5px var(--f-ui);padding:3px 7px;border-radius:6px}

@media (max-width:820px){
  .mapnote{font-size:11px;max-width:220px;padding:5px 8px;bottom:22px}
  .app{grid-template-columns:1fr;grid-template-rows:minmax(0,44%) minmax(0,56%)}
  .panel{border-left:0;border-top:1px solid var(--rule)}
  .head{padding:12px 16px 8px}.head h1{font-size:26px}
  .days{padding:8px 16px}.dayh{padding:12px 16px 4px}.card{padding:12px 16px 20px}.note{margin:6px 16px 16px}
}
</style>
</head>

<div class="app">
  <div id="map" aria-label="Карта маршрута по Милану" style="position:relative"></div>
  <aside class="panel">
    <div class="head">
      <div class="kick">Пешеходный маршрут · 21 точка</div>
      <h1>Милан <em>за два дня</em></h1>
      <div class="facts" id="facts"></div>
    </div>
    <div class="days" role="group" aria-label="Показать день">
      <button data-d="0" aria-pressed="true">Весь маршрут</button>
      <button data-d="1" aria-pressed="false"><i style="background:var(--d1)"></i>День 1</button>
      <button data-d="2" aria-pressed="false"><i style="background:var(--d2)"></i>День 2</button>
    </div>
    <div class="scroll" id="scroll"></div>
  </aside>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const STOPS=[{"day":1,"name":"Дуомо — Миланский собор","it":"Duomo di Milano","ll":[45.4642,9.1916],"time":"1,5–2 ч","hist":"Собор начали строить в 1386 году по воле герцога Джан Галеаццо Висконти, а фасад закончили только при Наполеоне, в начале XIX века: в 1805 году он короновался здесь королём Италии. Это одна из крупнейших готических церквей мира: на крышах и фасаде около 3400 статуй и 135 шпилей. Собор целиком облицован розовато-белым мрамором из карьеров Кандольи у озера Маджоре — ими до сих пор владеет Veneranda Fabbrica, организация, которая строит и чинит собор с XIV века. На главном шпиле на высоте 108,5 м стоит позолоченная Мадоннина (1774), символ Милана.","price":"Собор + музей — 10 €; вместе с террасами: по лестнице — 22 €, на лифте — 26 €. Билеты на официальном сайте, плюс сбор 1–1,5 €.","paid":true,"cost":22,"tip":"Поднимайтесь на террасы ближе к закату: мрамор розовеет, а среди шпилей легко найти неожиданного «боксёра» — статую XX века. Внутри у входа в пол врезана латунная меридиана 1786 года: в солнечный полдень на неё падает луч из отверстия в своде.","site":"https://www.duomomilano.it/"},{"day":1,"name":"Музей XX века (Новеченто)","it":"Museo del Novecento","ll":[45.4632,9.1899],"time":"1–1,5 ч","hist":"Музей открылся в 2010 году во дворце Аренгарио, построенном в 1930-е годы на площади Дуомо. Здесь итальянское искусство XX века: футуристы (Боччони, Балла, Карра), метафизика де Кирико, Моранди, Фонтана. По пандусу у входа вы проходите мимо огромного полотна «Четвёртое сословие» Пеллиццы да Вольпедо (1901) — одной из самых известных картин о рабочем движении.","price":"10 € (с 10 мая 2026); в первое воскресенье месяца бесплатно. Годовая Milano Museo Card за 15 € даёт вход во все городские музеи, включая Сфорцеско.","paid":true,"cost":10,"tip":"Дойдите до последнего зала с неоновой спиралью Лучо Фонтаны: из его панорамного окна открывается, пожалуй, лучший вид на фасад Дуомо с высоты, без очереди на крышу.","site":"https://www.museodelnovecento.org/"},{"day":1,"name":"Галерея Виктора Эммануила II","it":"Galleria Vittorio Emanuele II","ll":[45.4657,9.19],"time":"30 мин","hist":"Крытый пассаж из стекла и железа построили в 1865–1877 годах по проекту Джузеппе Менгони; архитектор погиб, упав с лесов, за несколько дней до торжественного открытия. В плане это крест с восьмиугольной площадью под стеклянным куполом высотой около 47 м; мозаики на полу и в люнетах изображают части света и гербы итальянских городов. Здесь с 1913 года работает первый магазин Prada, а с 1915-го — бар Camparino.","price":"Бесплатно.","paid":false,"cost":0,"tip":"В центре на полу — мозаичный бык, герб Турина. По примете надо крутануться на пятке на определённом месте мозаики, чтобы вернуться в Милан; вы сразу увидите, где — там стёртая ямка и небольшая очередь.","site":""},{"day":1,"name":"Театр Ла Скала и его музей","it":"Teatro alla Scala","ll":[45.4674,9.1895],"time":"45 мин","hist":"Театр построил архитектор Джузеппе Пьермарини после пожара старого придворного театра; открыт 3 августа 1778 года оперой Сальери. Название — от церкви Санта-Мария-алла-Скала, стоявшей на этом месте. Здесь впервые прозвучали «Набукко» и «Отелло» Верди, «Мадам Баттерфляй» Пуччини. В 1943 году здание разбомбили, а в 1946-м оно вновь открылось концертом Артуро Тосканини. Новый сезон традиционно начинается 7 декабря, в день святого Амвросия.","price":"Музей театра — 12 € (льготный 8 €).","paid":true,"cost":12,"tip":"Из музея можно заглянуть в зрительный зал через ложу — но только когда нет репетиции. Лучше всего идти к открытию, в 9:30: утром ложи чаще открыты.","site":"https://www.museoscala.org/"},{"day":1,"name":"Музей Польди-Пеццоли","it":"Museo Poldi Pezzoli","ll":[45.4685,9.1925],"time":"1 ч","hist":"Дом-музей аристократа и коллекционера Джан Джакомо Польди-Пеццоли (1822–1879), который завещал свою коллекцию городу; музей открылся в 1881 году. После бомбардировки 1943 года залы восстановили к 1951-му. Главная звезда — «Портрет молодой женщины» работы Пьеро дель Поллайоло, ставший эмблемой музея; рядом Боттичелли, Мантенья, Пьеро делла Франческа.","price":"15 € (молодёжь 10–25 лет — 10 €); выходной — вторник.","paid":true,"cost":15,"tip":"Не пропустите оружейный зал: его в 2000 году заново оформил скульптор Арнальдо Помодоро. Музей маленький и тихий — идеальная пауза после толп у Дуомо.","site":"https://museopoldipezzoli.it/"},{"day":1,"name":"Виа Монтенаполеоне — «Золотой квадрат»","it":"Via Montenapoleone","ll":[45.4685,9.1955],"time":"30–40 мин","hist":"Улица названа в честь Монте Наполеоне — государственного финансового учреждения наполеоновской эпохи, которое вело дела по государственному долгу. Вместе с виа делла Спига, виа Мандзони и корсо Венеция она образует Quadrilatero della moda — «модный квадрат» с флагманскими бутиками мировых домов моды, которые разместились в старинных палаццо.","price":"Бесплатно (если только не начнёте покупки).","paid":false,"cost":0,"tip":"Загляните в кондитерскую Cova (основана в 1817 году у Ла Скала, сюда переехала в 1950-м) — кофе у стойки стоит заметно дешевле, чем за столиком. Через квартал, на виа Джезу, — тихий дом-музей Баготти-Вальсекки, если останутся силы.","site":""},{"day":1,"name":"Пинакотека Брера","it":"Pinacoteca di Brera","ll":[45.4719,9.1879],"time":"2 ч","hist":"Палаццо Брера был иезуитской коллегией; в 1776 году Мария Терезия основала здесь Академию изящных искусств, а в 1809-м при Наполеоне открылась картинная галерея — в неё свозили шедевры из закрытых церквей и монастырей. Здесь «Мёртвый Христос» Мантеньи, «Обручение Девы Марии» Рафаэля, «Ужин в Эммаусе» Караваджо и «Поцелуй» Айеца. Во дворе стоит бронзовый Наполеон в образе Марса-Миротворца по модели Кановы.","price":"Билет «Grande Brera» (пинакотека + палаццо Читтерио) — 20 €, 18–25 лет — 4 €, до 18 бесплатно. Первое воскресенье месяца бесплатно по брони. Выходной — понедельник.","paid":true,"cost":20,"tip":"После музея пройдите во внутренний Ботанический сад Бреры (вход бесплатный) — зелёный уголок, о котором знают немногие туристы. Вечером узкие улочки Бреры — одно из лучших мест для ужина.","site":"https://pinacotecabrera.org/"},{"day":1,"name":"Замок Сфорца","it":"Castello Sforzesco","ll":[45.4705,9.1795],"time":"1,5 ч","hist":"Крепость заложили Висконти в XIV веке, а с 1450 года Франческо Сфорца перестроил её в герцогскую резиденцию; при его сыне Лодовико Моро здесь работали Леонардо да Винчи и Браманте. Центральную башню Филарете пришлось строить заново (1900–1905): в XVI веке она взлетела на воздух из-за пороха, хранившегося внутри. Сегодня в замке городские музеи: зал Ассе с росписью Леонардо и «Пьета Ронданини» — последняя, незаконченная работа Микеланджело.","price":"Дворы и парк — бесплатно; музеи замка — 10 € (с 10 мая 2026), первое воскресенье месяца бесплатно.","paid":true,"cost":10,"tip":"Даже если не пойдёте в музеи, пройдите насквозь все три двора к парку. А если пойдёте — начните с «Пьеты Ронданини»: её выставляют отдельно, в бывшем испанском госпитале замка.","site":"https://www.milanocastello.it/"},{"day":1,"name":"Парк Семпионе и Арка Мира","it":"Parco Sempione · Arco della Pace","ll":[45.4757,9.1726],"time":"40 мин","hist":"Парк в английском стиле разбил Эмилио Алеманья в 1888–1894 годах на месте охотничьих угодий Сфорца и военного плаца. Арку Мира начал Луиджи Каньола в 1807 году в честь побед Наполеона, а закончили уже при австрийцах в 1838-м и посвятили миру 1815 года. Над парком поднимается башня Бранка (1933, Джо Понти) высотой 108 м.","price":"Бесплатно (подъём на башню Бранка — платно).","paid":false,"cost":0,"tip":"Возле Триеннале спрятан фонтан «Таинственные купальни» Джорджо де Кирико (1973) — странные полосатые купальщики на воде. Для детей и просто на отдых — лучший зелёный привал первого дня.","site":""},{"day":1,"name":"Монументальное кладбище","it":"Cimitero Monumentale","ll":[45.4855,9.1795],"time":"1 ч","hist":"Кладбище открыли в 1866 году по проекту Карло Мачакини — в эклектичном стиле с полосатыми фасадами. Это настоящий музей скульптуры под открытым небом: здесь работали Медардо Россо, Адольфо Вильдт, Джо Понти. В центральном Фамедио («храме славы») похоронен писатель Алессандро Мандзони и увековечены знаменитые миланцы.","price":"Бесплатно; выходной — понедельник.","paid":false,"cost":0,"tip":"Возьмите у входа бесплатную схему и найдите гробницу семьи Кампари — с бронзовой «Тайной вечерей» в натуральную величину. Это тихое, красивое и совсем не мрачное место.","site":""},{"day":1,"name":"Порта-Нуова: площадь Гэ Ауленти и «Вертикальный лес»","it":"Piazza Gae Aulenti · Bosco Verticale","ll":[45.4848,9.1903],"time":"40 мин","hist":"Новый деловой квартал вырос в 2009–2014 годах на месте пустырей и железнодорожных путей. Круглая площадь носит имя архитектора Гэ Ауленти; над ней — башня UniCredit высотой 231 м со шпилем, самое высокое здание Италии. Рядом — «Вертикальный лес» Стефано Боэри (2014): два жилых дома, на балконах которых растут около 800 деревьев и тысячи кустарников.","price":"Бесплатно.","paid":false,"cost":0,"tip":"Вернитесь сюда к вечеру: подсветка башен и фонтаны на площади — самая «современная» открытка Милана. Рядом парк Biblioteca degli Alberi, где удобно посидеть.","site":""},{"day":2,"name":"Санта-Мария-делле-Грацие и «Тайная вечеря»","it":"Santa Maria delle Grazie · Cenacolo","ll":[45.4659,9.1709],"time":"45 мин","hist":"Церковь доминиканцев построили в 1463–1490-х годах; герцог Лодовико Моро поручил Браманте возвести новую апсиду с куполом. В трапезной монастыря Леонардо в 1495–1498 годах написал «Тайную вечерю» — темперой по сухой штукатурке, поэтому краска стала осыпаться ещё при его жизни. В 1943 году бомба разрушила трапезную, но стену с фреской спасли мешки с песком. Последняя большая реставрация длилась с 1978 по 1999 год; с 1980 года это объект ЮНЕСКО.","price":"15 € (18–25 лет — 2 €, до 18 бесплатно), только по предварительной брони; сеанс 15 минут. Первое воскресенье месяца бесплатно. Выходной — понедельник.","paid":true,"cost":15,"tip":"Это единственная точка маршрута, которую нужно планировать заранее: билеты выкладывают на сайте раз в три месяца, и они разлетаются быстро. Если не успели, ищите экскурсию с гидом, в которую уже включён вход. Саму церковь с куполом Браманте можно посмотреть бесплатно.","site":"https://cenacolovinciano.org/"},{"day":2,"name":"Музей науки и техники им. Леонардо","it":"Museo Nazionale della Scienza e della Tecnologia","ll":[45.4628,9.1715],"time":"1,5–2 ч","hist":"Музей открылся в 1953 году к 500-летию Леонардо в бывшем монастыре Сан-Витторе-аль-Корпо XVI века. Здесь крупнейшая коллекция моделей машин по рисункам Леонардо, паровозы, корабли, авиация и космос. Во дворе стоит настоящая подводная лодка «Энрико Тоти» — первая подлодка, построенная в Италии после Второй мировой войны (спущена в 1967 году).","price":"Около 13 €; экскурсия в подводную лодку — ещё около 10 € по брони. Выходной — понедельник.","paid":true,"cost":13,"tip":"Если интересна подлодка — бронируйте слот на неё онлайн сразу, мест немного. С детьми этот музей можно поставить и вместо пинакотеки.","site":"https://www.museoscienza.org/"},{"day":2,"name":"Базилика Сант-Амброджо","it":"Basilica di Sant'Ambrogio","ll":[45.4624,9.1754],"time":"30 мин","hist":"Церковь основал в 379–386 годах святой Амвросий, епископ Милана и покровитель города; его мощи покоятся в крипте. Нынешний облик с атриумом и двумя колокольнями сложился в XI–XII веках и стал образцом ломбардской романики. Внутри — «Золотой алтарь» мастера Вольвиния (IX век) из позолоченного серебра и драгоценных камней.","price":"Бесплатно.","paid":false,"cost":0,"tip":"Слева от базилики стоит римская «Колонна дьявола» с двумя дырами: по легенде, их оставили рога чёрта, промахнувшегося в святого Амвросия. А в начале декабря вокруг базилики шумит ярмарка «O bej! O bej!».","site":""},{"day":2,"name":"Сан-Маурицио-аль-Монастеро-Маджоре","it":"San Maurizio al Monastero Maggiore","ll":[45.4655,9.1795],"time":"30 мин","hist":"Церковь женского бенедиктинского монастыря строили с 1 р для Дуомо. После упадка в XX веке Дарсену расчистили и благоустроили к выставке Expo 2015; теперь это набережная для прогулок.","price":"Бесплатно.","paid":false,"cost":0,"tip":"На краю площади XXIV Мая работает крытый рынок Mercato Comunale — удобно перекусить. С набережной хорошо видны старые ворота Порта-Тичинезе.","site":""},{"day":2,"name":"Навильо-Гранде и Виколо-дей-Лавандаи","it":"Naviglio Grande · Vicolo dei Lavandai","ll":[45.4505,9.1725],"time":"1 ч и вечер","hist":"Навильо-Гранде прокопали в XII–XIII веках от реки Тичино — это один из древнейших судоходных каналов Европы. В переулке Виколо-дей-Лавандаи до 1950-х годов прачки стирали бельё прямо в канале на каменных плитах, стоя на коленях в деревянных ящиках; плиты и навес сохранились.","price":"Бесплатно.","paid":false,"cost":0,"tip":"Закончите маршрут здесь в час аперитива (примерно с 18:00), когда вдоль канала зажигаются бары. В последнее воскресенье месяца вдоль Навильо-Гранде работает большой антикварный рынок.","site":""}];

const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

const hav=(a,b)=>{const r=Math.PI/180,dl=(b[0]-a[0])*r,dn=(b[1]-a[1])*r,h=Math.sin(dl/2)**2+Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(dn/2)**2;return 6371*2*Math.asin(Math.sqrt(h))};
const WALK=1.3; // streets are longer than a straight line
const dayKm=d=>{const p=STOPS.filter(s=>s.day===d).map(s=>s.ll);let k=0;for(let i=1;i<p.length;i++)k+=hav(p[i-1],p[i]);return k*WALK};

  });

  $("scroll").innerHTML=h;$("scroll").scrollTop=listScroll;
  $("scroll").querySelectorAll(".stops button").forEach(b=>b.onclick=()=>{listScroll=$("scroll").scrollTop;openStop(+b.dataset.i,true)});
}

    <div class="nav"><button id="back">← Весь список</button><span class="sp"></span>
      <button id="prev" ${prev?"":"disabled"} aria-label="Предыдущая точка">←</button><button id="next" ${next?"":"disabled"} aria-label="Следующая точка">→</button></div>
    <div class="top"><span class="num" style="background:var(${dc})">${s.n}</span><div><h2>${esc(s.name)}</h2><p class="it">${esc(s.it)}</p></div></div>
    <div class="meta"><span>День ${s.day}</span><span>На посещение: ${esc(s.time)}</span>${legKm?`<span>от точки ${s.n-1}: ≈ ${fmt(legKm)} км, ${Math.max(3,Math.round(legKm/4.5*60))} мин пешком</span>`:""}</div>
    <section class="sec"><h3>Историческая справка</h3><p>${esc(s.hist)}</p></section>
    <section class="sec price"><h3>Стоимость</h3><p>${esc(s.price)}</p></section>
    <section class="sec tip"><h3>От меня</h3><p>${esc(s.tip)}</p></section>
    ${s.site?`<a href="${s.site}" target="_blank" rel="noopener">Официальный сайт ↗</a>`:""}
  </article>`;
  $("scroll").scrollTop=0;
  $("back").onclick=()=>{renderList();fitDay()};
  $("prev").onclick=()=>openStop(i-1,true);$("next").onclick=()=>openStop(i+1,true);
  if(fly||!map.getBounds().pad(-.2).contains(s.ll))map.flyTo(s.ll,Math.max(map.getZoom(),15.5),{duration:.6});
}
document.querySelectorAll(".days button").forEach(b=>b.onclick=()=>{
  DAY=+b.dataset.d;document.querySelectorAll(".days button").forEach(x=>x.setAttribute("aria-pressed",x===b));
  listScroll=0;renderList();fitDay();
});
document.addEventListener("keydown",e=>{if(CUR<0||e.target.closest("input"))return;if(e.key==="ArrowRight"&&CUR<STOPS.length-1)openStop(CUR+1,true);if(e.key==="ArrowLeft"&&CUR>0)openStop(CUR-1,true);if(e.key==="Escape"){renderList();fitDay()}});
renderList();fitDay();
</script>

</body>
</html>
